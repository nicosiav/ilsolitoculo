<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6A3E">
<title>Il Solito Culo — fantacalcio</title>
<meta name="description" content="Rose, calendario, classifiche e statistiche della lega Il Solito Culo.">
<link rel="icon" type="image/png" sizes="32x32" href="schiera/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
:root {
  --bg: #EDF1EA;
  --surface: #FFFFFF;
  --surface-2: #F5F7F2;
  --ink: #14201A;
  --muted: #5B6960;
  --line: #D5DCD2;
  --pitch-1: #1D6A3E;
  --pitch-2: #217547;
  --role-p: #E08A08;
  --role-d: #1C9651;
  --role-c: #1E6BCB;
  --role-a: #D2372C;
  --primary: #14201A;
  --on-primary: #FFFFFF;
  --warn-bg: #FFF4DA;
  --warn-ink: #7A4B00;
  --ok: #1C9651;
  --ko: #D2372C;
  --scrim: rgba(10, 18, 13, .45);
  --shadow: 0 1px 2px rgba(20, 32, 26, .08), 0 6px 20px rgba(20, 32, 26, .08);
  --display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* grafici: tinte scelte per ogni tema, non "schiarite" in automatico */
  --chart-accent: #1E6BCB;
  --chart-b: #E08A08;
  --chart-mute: #9AA79F;
  --chart-grid: rgba(20, 32, 26, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C120E; --surface: #141C17; --surface-2: #1A241E; --ink: #E6EDE7;
    --muted: #93A298; --line: #28342D; --pitch-1: #154D2D; --pitch-2: #185533;
    --role-p: #F2A42C; --role-d: #39BE74; --role-c: #4A93EE; --role-a: #EF5A4E;
    --primary: #E6EDE7; --on-primary: #0C120E; --warn-bg: #3A2B0C; --warn-ink: #F6D48C;
    --ok: #39BE74; --ko: #EF5A4E; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    --chart-accent: #4A93EE; --chart-b: #C47A12; --chart-mute: #6E7C74; --chart-grid: rgba(230, 237, 231, .12);
  }
}
:root[data-theme="dark"] {
  --bg: #0C120E; --surface: #141C17; --surface-2: #1A241E; --ink: #E6EDE7;
  --muted: #93A298; --line: #28342D; --pitch-1: #154D2D; --pitch-2: #185533;
  --role-p: #F2A42C; --role-d: #39BE74; --role-c: #4A93EE; --role-a: #EF5A4E;
  --primary: #E6EDE7; --on-primary: #0C120E; --warn-bg: #3A2B0C; --warn-ink: #F6D48C;
  --ok: #39BE74; --ko: #EF5A4E; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  --chart-accent: #4A93EE; --chart-b: #C47A12; --chart-mute: #6E7C74; --chart-grid: rgba(230, 237, 231, .12);
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 400 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--role-c); outline-offset: 2px; }
a { color: inherit; }

.site { max-width: 760px; margin: 0 auto; padding: 12px 16px 96px; display: flex; flex-direction: column; gap: 14px; }

/* intestazione */
.top { display: flex; align-items: center; gap: 12px; position: relative; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.crest {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  background: linear-gradient(160deg, var(--pitch-2), var(--pitch-1));
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .22);
}
.brand h1 { margin: 0; font: 700 23px/1.05 var(--display); letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }
.brand small { color: var(--muted); font-size: 12.5px; }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); color: inherit;
  border-radius: 999px; padding: 7px 13px; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.menu-pop {
  position: absolute; right: 0; top: 46px; z-index: 40; min-width: 230px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px;
}
.menu-pop button, .menu-pop .menu-link {
  text-align: left; background: transparent; border: 0; border-radius: 10px;
  padding: 11px 12px; font-size: 15px; text-decoration: none; display: block;
}
.menu-pop button:hover, .menu-pop .menu-link:hover { background: var(--surface-2); }
.menu-head { padding: 10px 12px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu-head b { display: block; font-size: 15px; }
.menu-head span { color: var(--muted); font-size: 12.5px; }

/* navigazione */
.tabs {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px; position: sticky; top: 0; z-index: 20;
  background: linear-gradient(var(--bg) 70%, transparent);
  padding-top: 6px; margin: -6px -16px 0; padding-inline: 16px;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  flex: none; text-decoration: none; padding: 8px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px;
}
.tabs a[aria-current="page"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

/* superfici */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
.card > h2, .card > h3 { margin: 0; font: 700 18px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sec-h > span, .sec-h > a { margin-left: auto; text-align: right; }
.sec-h h2, .sec-h h3 { margin: 0; font: 700 19px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.sec-h span, .muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: grid; gap: 14px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; font-weight: 600; }
.btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn-ghost { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.linkish { border: 0; background: transparent; color: var(--muted); text-decoration: underline; padding: 4px 0; font-size: 13px; }

/* accesso */
.login form { display: grid; gap: 8px; }
.login input { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.row-links { display: flex; gap: 16px; flex-wrap: wrap; }

/* riquadri con i numeri */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; }
.tile b { display: block; font: 700 27px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.tile span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.tile.good b { color: var(--ok); }
.tile.bad b { color: var(--ko); }

/* tabelle */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: right; font: 700 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 5px; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th.l, .tbl td.l { text-align: left; }
.tbl td { padding: 9px 5px; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.me td { background: var(--surface-2); font-weight: 600; }
.tbl tr.clickable { cursor: pointer; }
.tbl .nm { font-weight: 600; }
.tbl .pos { color: var(--muted); width: 22px; }
.scroll-x { overflow-x: auto; margin-inline: -14px; padding-inline: 14px; }

.badge {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px;
  background: var(--rc, var(--muted)); color: #fff; font: 700 11px/1 var(--display); flex: none;
}
[data-r="P"] { --rc: var(--role-p); } [data-r="D"] { --rc: var(--role-d); }
[data-r="C"] { --rc: var(--role-c); } [data-r="A"] { --rc: var(--role-a); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 12px; font-size: 13.5px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

/* partite */
.match {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding: 11px 12px; border-top: 1px solid var(--line); background: transparent; width: 100%;
  border-left: 0; border-right: 0; border-bottom: 0; text-align: left;
}
.match:first-child { border-top: 0; }
.match .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.match .t.a { text-align: right; }
.match .score {
  font: 700 19px/1 var(--display); font-variant-numeric: tabular-nums;
  background: var(--surface-2); border-radius: 9px; padding: 6px 10px; white-space: nowrap;
}
.match .pts { display: block; font: 400 11px/1.3 var(--body); color: var(--muted); }
.match.win-h .t:first-child, .match.win-a .t.a { font-weight: 700; }
.match.win-h .t.a, .match.win-a .t:first-child { color: var(--muted); }

/* grafico */
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart text { font: 400 10px/1 var(--body); fill: var(--muted); }
.chart .lbl { font-weight: 600; fill: var(--ink); }
.chart-wrap { position: relative; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 7px 10px; font-size: 13px; white-space: nowrap;
  transform: translate(-50%, -110%); opacity: 0; transition: opacity .12s;
}
.tip b { font-variant-numeric: tabular-nums; }

/* legenda dei grafici */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--chart-accent); display: inline-block; }
.legend .b i { background: var(--chart-b); }

/* esito partita */
.esito { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font: 700 11px/1 var(--display); color: #fff; }
.esito.v { background: var(--ok); } .esito.n { background: var(--muted); } .esito.p { background: var(--ko); }

/* elenco giocatori */
.plist { display: grid; }
.prow {
  display: grid; grid-template-columns: 20px 1fr auto; gap: 9px; align-items: center;
  padding: 9px 2px; border-top: 1px solid var(--line);
}
.prow:first-child { border-top: 0; }
.prow .who { min-width: 0; }
.prow .who b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .who span { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 84px; }
.prow .val b { font-weight: 700; }
.prow .val span { display: block; color: var(--muted); font-size: 11.5px; }
.group-h { font: 700 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 12px 2px 4px; }

/* avvisi */
.notice {
  display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
  background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 11px 12px; font-size: 14px;
}
.notice.error { background: color-mix(in srgb, var(--ko) 14%, var(--surface)); color: var(--ko); }
.notice button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; }
#notices { display: grid; gap: 8px; }

/* foglio modale */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 60; }
.sheet {
  background: var(--surface); width: min(760px, 100%); max-height: 92vh; overflow: auto;
  border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.sheet-h { padding: 16px 16px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.sheet-h h4 { margin: 0; font: 700 19px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.sheet-h p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.sheet-b { padding: 4px 16px 12px; }
.sheet-f { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }
.sheet-f .btn { flex: 1; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80;
  background: var(--primary); color: var(--on-primary); padding: 10px 16px; border-radius: 12px;
  font-size: 14px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}

.foot { color: var(--muted); font-size: 12px; text-align: center; padding-top: 6px; }
.empty { color: var(--muted); padding: 18px 2px; text-align: center; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

</style>
</head>
<body>
<div class="site">
  <header class="top">
    <div class="brand">
      <span class="crest" aria-hidden="true"></span>
      <div>
        <h1>Il Solito Culo</h1>
        <small id="sub">fantacalcio dal 1991</small>
      </div>
    </div>
    <button class="icon-btn" id="userBtn" type="button" aria-haspopup="true" aria-expanded="false" hidden></button>
    <div class="menu-pop" id="userPop" hidden>
      <div class="menu-head" id="userHead"></div>
      <a class="menu-link" id="schieraLink" href="schiera/">Schiera la formazione</a>
      <button type="button" id="adminBtn" hidden>Carica la giornata</button>
      <button type="button" id="themeBtn">Tema chiaro / scuro</button>
      <button type="button" id="logoutBtn">Esci</button>
    </div>
  </header>

  <nav class="tabs" id="nav" aria-label="Sezioni" hidden></nav>

  <section class="card login" id="loginCard" hidden>
    <h2>Entra con il tuo account</h2>
    <p>Rose, calendario, classifiche e statistiche della lega, sempre aggiornati.</p>
    <form id="loginForm">
      <label class="small muted" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label class="small muted" for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit" id="loginBtn">Entra</button>
    </form>
    <div class="row-links">
      <button type="button" id="recoverBtn" class="linkish">Password dimenticata</button>
      <a class="linkish" href="schiera/">Vai a Schiera Formazione</a>
    </div>
  </section>

  <div id="notices"></div>
  <main id="view" aria-live="polite"></main>

  <footer class="foot" id="foot"></footer>
</div>
<div id="layer"></div>
<input type="file" id="roundFile" accept=".xls,application/vnd.ms-excel" hidden>

<script>
/* Collegamento al database della lega (Supabase).

<script>
/* Client minimo per Supabase (autenticazione, dati, storage).
 * Nessuna libreria esterna: sono le stesse chiamate HTTP che farebbe supabase-js. */
(function (root) {
  'use strict';

  const KEY = 'schiera-sessione:v1';
  const cfg = () => root.SCHIERA_CONFIG || {};
  const base = () => String(cfg().url || '').replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
  const anon = () => cfg().anonKey || '';

  let session = null;
  try { session = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { session = null; }

  function store(s) {
    session = s;
    try { s ? localStorage.setItem(KEY, JSON.stringify(s)) : localStorage.removeItem(KEY); } catch (e) { /* ok */ }
  }

  class SbError extends Error {
    constructor(message, code, status) { super(message); this.code = code; this.status = status; }
  }

  const MESSAGES = {
    invalid_credentials: 'Email o password non corretti.',
    email_not_confirmed: 'Account non ancora confermato: chiedi all’amministratore.',
    over_request_rate_limit: 'Troppi tentativi: riprova tra qualche minuto.',
    P0001: 'Questo account non è collegato a nessuna squadra: scrivi all’amministratore.',
    P0002: 'La giornata è finita: la formazione non si può più cambiare.',
    P0004: 'Puoi schierare solo giocatori della tua rosa.',
    P0005: 'Serve un account da amministratore per questa operazione.',
    '42501': 'Non hai i permessi per questa operazione.'
  };

  function fail(status, body) {
    const code = body && (body.error_code || body.code || body.error) || String(status);
    const msg = MESSAGES[code] ||
      (body && (body.message || body.msg || body.errore || body.error_description || body.error)) ||
      ('Errore di rete (' + status + ')');
    return new SbError(msg, code, status);
  }

  async function call(path, opts = {}) {
    const res = await fetch(base() + path, {
      method: opts.method || 'GET',
      headers: Object.assign({ apikey: anon(), 'Content-Type': 'application/json' }, opts.headers || {}),
      body: opts.body === undefined ? undefined : JSON.stringify(opts.body)
    });
    const text = await res.text();
    let data = null;
    if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
    if (!res.ok) throw fail(res.status, data);
    return data;
  }

  async function refresh() {
    if (!session || !session.refresh_token) throw new SbError('Sessione scaduta: entra di nuovo.', 'no_session', 401);
    const d = await call('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: session.refresh_token } });
    store(normalize(d));
    return session;
  }

  function normalize(d) {
    return {
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
      user: d.user || (session && session.user) || null
    };
  }

  async function authed(path, opts = {}) {
    if (!session) throw new SbError('Devi entrare con il tuo account.', 'no_session', 401);
    if (session.expires_at && session.expires_at - 60 < Math.floor(Date.now() / 1000)) await refresh();
    const withToken = () => Object.assign({ Authorization: 'Bearer ' + session.access_token }, opts.headers || {});
    try {
      return await call(path, Object.assign({}, opts, { headers: withToken() }));
    } catch (e) {
      if (e.status === 401) { await refresh(); return call(path, Object.assign({}, opts, { headers: withToken() })); }
      throw e;
    }
  }

  const api = {
    SbError,
    configured: () => !!(base() && anon()),
    session: () => session,
    user: () => session && session.user,

    async signIn(email, password) {
      const d = await call('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: String(email).trim(), password } });
      store(normalize(d));
      return session;
    },

    async signOut() {
      try { if (session) await authed('/auth/v1/logout', { method: 'POST', body: {} }); } catch (e) { /* esco comunque */ }
      store(null);
    },

    // Invia l'email per reimpostare la password
    recover(email, redirectTo) {
      const q = redirectTo ? '?redirect_to=' + encodeURIComponent(redirectTo) : '';
      return call('/auth/v1/recover' + q, { method: 'POST', body: { email: String(email).trim() } });
    },

    // Dopo il link ricevuto per email: la sessione arriva nel fragment dell'URL
    adoptFromHash() {
      const h = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
      if (!h.get('access_token')) return null;
      store({
        access_token: h.get('access_token'),
        refresh_token: h.get('refresh_token'),
        expires_at: Math.floor(Date.now() / 1000) + (+h.get('expires_in') || 3600),
        user: null
      });
      const type = h.get('type');

<script>
/* Motore .xls (BIFF8 dentro CFB) per schierare la formazione.
 * Modifica solo le celle necessarie e conserva macro, pulsanti, formati e fogli. */
(function (root) {
  'use strict';

  const FREESECT = 0xFFFFFFFF, ENDOFCHAIN = 0xFFFFFFFE, FATSECT = 0xFFFFFFFD;

  class XlsError extends Error {}

  // ---------------------------------------------------------------- CFB ----
  function readCFB(u8) {
    if (u8.length < 1024) throw new XlsError('Il file è troppo piccolo per essere un .xls.');
    const sig = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
    for (let i = 0; i < 8; i++) {
      if (u8[i] !== sig[i]) {
        if (u8[0] === 0x50 && u8[1] === 0x4B) throw new XlsError('Questo è un file .xlsx/.xlsm: serve il file .xls ricevuto dall\u2019amministratore.');

      }
    }
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const u32 = o => dv.getUint32(o, true);
    const ss = 1 << dv.getUint16(0x1E, true);
    const mss = 1 << dv.getUint16(0x20, true);
    const csectFat = u32(0x2C), dirStart = u32(0x30), miniCutoff = u32(0x38);
    const miniFatStart = u32(0x3C), difatStart = u32(0x44), csectDifat = u32(0x48);
    const secOff = s => (s + 1) * ss;

    const difat = [];
    for (let i = 0; i < Math.min(csectFat, 109); i++) difat.push(u32(0x4C + i * 4));
    let ds = difatStart, guard = 0;
    while (difat.length < csectFat && ds < 0xFFFFFFFA && guard++ < csectDifat + 2) {
      const per = ss / 4 - 1;
      for (let i = 0; i < per && difat.length < csectFat; i++) difat.push(u32(secOff(ds) + i * 4));
      ds = u32(secOff(ds) + per * 4);
    }
    const fat = [];
    for (const s of difat) for (let i = 0; i < ss / 4; i++) fat.push(u32(secOff(s) + i * 4));

    const chainOf = (start, table) => {
      const out = [];
      let s = start;
      while (s < 0xFFFFFFFA) {
        if (out.length > table.length) throw new XlsError('Struttura del file danneggiata (catena di settori ciclica).');
        out.push(s);
        s = table[s];
        if (s === undefined) throw new XlsError('Struttura del file danneggiata (settore fuori tabella).');
      }
      return out;
    };

    const dirChain = chainOf(dirStart, fat);
    const entries = [];
    for (let k = 0; k < dirChain.length; k++) {
      for (let j = 0; j < ss / 128; j++) {
        const o = secOff(dirChain[k]) + j * 128;
        const nl = dv.getUint16(o + 64, true);

    const cfb = { u8, dv, ss, mss, miniCutoff, difat, fat, entries, dirChain, secOff, chainOf };

    cfb.read = ent => {

        const miniFat = [];
        for (const s of chainOf(miniFatStart, fat)) for (let i = 0; i < ss / 4; i++) miniFat.push(u32(secOff(s) + i * 4));
        const out = new Uint8Array(ent.size);
        let p = 0;
        for (const m of chainOf(ent.start, miniFat)) {
          const n = Math.min(mss, ent.size - p);
          out.set(miniData.subarray(m * mss, m * mss + n), p);

        }

      return readChain(chainOf(ent.start, fat), ent.size);
    };
    function readChain(chain, size) {
      const out = new Uint8Array(size);
      let p = 0;
      for (const s of chain) {
        if (p >= size) break;
        const n = Math.min(ss, size - p);
        out.set(u8.subarray(secOff(s), secOff(s) + n), p);
        p += n;
      }

    }

  }

  // Sostituisce uno stream "grande" lasciando intatto tutto il resto del contenitore.
  function cfbReplaceStream(cfb, ent, data) {
    const { u8, ss, secOff } = cfb;
    if (ent.size < cfb.miniCutoff || data.length < cfb.miniCutoff) throw new XlsError('Stream troppo piccolo: struttura non supportata.');

    const difat = cfb.difat.slice();
    const oldChain = cfb.chainOf(ent.start, cfb.fat);
    const need = Math.ceil(data.length / ss);
    const chain = oldChain.slice(0, need);
    for (const s of oldChain.slice(need)) fat[s] = FREESECT;
    const taken = new Set(chain);
    const alloc = () => {
      for (;;) {
        for (let i = 0; i < fat.length; i++) {
          if (fat[i] === FREESECT && !taken.has(i)) { taken.add(i); return i; }
        }
        if (difat.length >= 109) throw new XlsError('File troppo grande per essere aggiornato.');
        const base = fat.length;
        for (let i = 0; i < ss / 4; i++) fat.push(FREESECT);
        fat[base] = FATSECT;
        taken.add(base);
        difat.push(base);
      }
    };
    while (chain.length < need) chain.push(alloc());
    for (let i = 0; i < chain.length; i++) fat[chain[i]] = i + 1 < chain.length ? chain[i + 1] : ENDOFCHAIN;

    let maxSec = Math.ceil((u8.length - ss) / ss) - 1;
    for (let i = 0; i < fat.length; i++) if (fat[i] !== FREESECT && i > maxSec) maxSec = i;
    const outLen = Math.max(u8.length, ss + (maxSec + 1) * ss);
    const out = new Uint8Array(outLen);
    out.set(u8);
    const dv = new DataView(out.buffer);
    for (let i = 0; i < chain.length; i++) {
      const o = secOff(chain[i]);
      out.fill(0, o, o + ss);
      out.set(data.subarray(i * ss, Math.min((i + 1) * ss, data.length)), o);
    }
    for (let k = 0; k < difat.length; k++) {
      const o = secOff(difat[k]);
      for (let i = 0; i < ss / 4; i++) dv.setUint32(o + i * 4, fat[k * (ss / 4) + i], true);
    }
    dv.setUint32(0x2C, difat.length, true);
    for (let i = 0; i < 109; i++) dv.setUint32(0x4C + i * 4, i < difat.length ? difat[i] : FREESECT, true);
    dv.setUint32(ent.fileOff + 116, chain[0], true);
    dv.setUint32(ent.fileOff + 120, data.length, true);
    dv.setUint32(ent.fileOff + 124, 0, true);
    return out;
  }

  // --------------------------------------------------------------- BIFF ----
  const SID = {
    BOF: 0x0809, EOF: 0x000A, BOUNDSHEET: 0x0085, SST: 0x00FC, CONTINUE: 0x003C, FILEPASS: 0x002F,
    ROW: 0x0208, DBCELL: 0x00D7, INDEX: 0x020B, DIMENSIONS: 0x0200, DEFCOLWIDTH: 0x0055, COLINFO: 0x007D,
    LABELSST: 0x00FD, NUMBER: 0x0203, RK: 0x027E, MULRK: 0x00BD, BLANK: 0x0201, MULBLANK: 0x00BE,
    FORMULA: 0x0006, STRING: 0x0207, BOOLERR: 0x0205, LABEL: 0x0204, RSTRING: 0x00D6,
    SHRFMLA: 0x04BC, ARRAY: 0x0221, TABLE: 0x0236, UNCALCED: 0x005E
  };
  const CELL_SIDS = new Set([SID.LABELSST, SID.NUMBER, SID.RK, SID.MULRK, SID.BLANK, SID.MULBLANK, SID.FORMULA, SID.BOOLERR, SID.LABEL, SID.RSTRING]);
  const ATTACHED_SIDS = new Set([SID.STRING, SID.SHRFMLA, SID.ARRAY, SID.TABLE, SID.CONTINUE]);

  const rd16 = (d, o) => d[o] | (d[o + 1] << 8);
  const rd32 = (d, o) => (d[o] | (d[o + 1] << 8) | (d[o + 2] << 16) | (d[o + 3] << 24)) >>> 0;
  const wr16 = (d, o, v) => { d[o] = v & 255; d[o + 1] = (v >>> 8) & 255; };
  const wr32 = (d, o, v) => { d[o] = v & 255; d[o + 1] = (v >>> 8) & 255; d[o + 2] = (v >>> 16) & 255; d[o + 3] = (v >>> 24) & 255; };
  const rdF64 = (d, o) => new DataView(d.buffer, d.byteOffset + o, 8).getFloat64(0, true);

  function parseRecords(wb) {
    const recs = [];
    let p = 0;
    while (p + 4 <= wb.length) {
      const sid = rd16(wb, p), len = rd16(wb, p + 2);
      if (p + 4 + len > wb.length) break;
      recs.push({ sid, off: p, len, data: wb.subarray(p + 4, p + 4 + len) });
      p += 4 + len;
    }
    return { recs, tail: wb.subarray(p) };
  }

  function decodeRK(rk) {
    let v;
    if (rk & 2) v = (rk >> 2);
    else {
      const b = new DataView(new ArrayBuffer(8));
      b.setUint32(4, rk & 0xFFFFFFFC, true);
      v = b.getFloat64(0, true);
    }
    return (rk & 1) ? v / 100 : v;
  }

  function decodeChars(d, o, cch, high) {
    let s = '';
    if (high) { for (let i = 0; i < cch; i++) s += String.fromCharCode(rd16(d, o + i * 2)); }
    else { for (let i = 0; i < cch; i++) s += String.fromCharCode(d[o + i]); }

  }

  // XLUnicodeString (cch a 16 bit) con eventuali formattazioni
  function readXLString(d, o) {
    const cch = rd16(d, o), fl = d[o + 2];
    let p = o + 3;
    let runs = 0, ext = 0;
    if (fl & 8) { runs = rd16(d, p); p += 2; }
    if (fl & 4) { ext = rd32(d, p); p += 4; }
    return decodeChars(d, p, cch, fl & 1);
  }

  function parseSST(recs, i) {
    const segs = [recs[i].data];
    for (let k = i + 1; k < recs.length && recs[k].sid === SID.CONTINUE; k++) segs.push(recs[k].data);
    let si = 0, p = 8;
    const unique = rd32(segs[0], 4);
    const out = [];
    const need = () => { while (si < segs.length && p >= segs[si].length) { si++; p = 0; } if (si >= segs.length) throw new XlsError('Tabella stringhe (SST) troncata.'); };

    const u16 = () => u8() | (u8() << 8);
    const u32 = () => (u16() | (u16() << 16)) >>> 0;
    const skip = n => { while (n > 0) { need(); const k = Math.min(n, segs[si].length - p); p += k; n -= k; } };
    for (let s = 0; s < unique; s++) {
      if (si >= segs.length || (si === segs.length - 1 && p >= segs[si].length)) break;
      const cch = u16();
      let fl = u8();
      let runs = 0, ext = 0;
      if (fl & 8) runs = u16();
      if (fl & 4) ext = u32();
      let str = '', left = cch;
      while (left > 0) {
        if (p >= segs[si].length) { si++; p = 0; if (si >= segs.length) throw new XlsError('SST troncata.'); fl = segs[si][p++]; }
        const d = segs[si];
        const w = (fl & 1) ? 2 : 1;
        const n = Math.min(left, Math.floor((d.length - p) / w));
        str += decodeChars(d, p, n, fl & 1);
        p += n * w; left -= n;
      }
      skip(runs * 4 + ext);
      out.push(str);
    }
    return out;
  }

  // ------------------------------------------------------------ Workbook ----
  function openWorkbook(u8) {
    const cfb = readCFB(u8);
    const ent = cfb.find('Workbook') || cfb.find('Book');
    if (!ent) throw new XlsError('Nel file non c\u2019è una cartella di lavoro Excel.');
    if (ent.name === 'Book') throw new XlsError('Formato Excel 5/95 non supportato: salva il file come Excel 97-2003 (.xls).');
    const wb = cfb.read(ent);
    const { recs, tail } = parseRecords(wb);
    if (!recs.length || recs[0].sid !== SID.BOF || rd16(recs[0].data, 0) !== 0x0600) throw new XlsError('Versione di Excel non supportata (serve .xls 97-2003).');
    let sst = [];
    const sheets = [];
    const supbooks = [];
    let xti = [];
    for (let i = 0; i < recs.length; i++) {
      const r = recs[i];

      if (r.sid === SID.SST) sst = parseSST(recs, i);

      if (r.sid === 0x0017) {
        const n = rd16(r.data, 0);

        for (let k = 0; k < n && 2 + k * 6 + 6 <= r.data.length; k++) {
          const o = 2 + k * 6;
          xti.push({ sup: rd16(r.data, o), first: (rd16(r.data, o + 2) << 16) >> 16, last: (rd16(r.data, o + 4) << 16) >> 16 });

        if (recs[i].sid === SID.BOF) depth++;

      }
      s.start = i0; s.end = i;
    }
    for (const x of xti) x.self = !!(supbooks[x.sup] && supbooks[x.sup].self);
    return { cfb, ent, wb, recs, tail, sst, sheets, xti, models: new Map() };
  }

  // ---------------------------------------------------------- Sheet model ----
  function cellFromRec(r) {
    const d = r.data;
    const c = { sid: r.sid, data: d, row: rd16(d, 0), col: rd16(d, 2), extra: [] };
    if (r.sid === SID.MULRK || r.sid === SID.MULBLANK) c.colLast = rd16(d, d.length - 2);
    else c.colLast = c.col;
    return c;
  }

  function buildSheet(book, sh) {
    const recs = book.recs;
    // la tabella delle celle: sequenza contigua di ROW / celle (+ record collegati) / DBCELL
    let first = -1, last = -1, depth = 0;
    for (let i = sh.start; i <= sh.end; i++) {
      const s = recs[i].sid;
      if (s === SID.BOF) depth++;
      if (s === SID.EOF) depth--;
      if (depth !== 1) continue;
      if (first < 0) { if (s === SID.ROW || CELL_SIDS.has(s)) first = i; else continue; }
      const prev = recs[i - 1].sid;
      const attached = (s === SID.STRING || s === SID.SHRFMLA || s === SID.ARRAY || s === SID.TABLE) ||
        (s === SID.CONTINUE && (prev === SID.STRING || prev === SID.CONTINUE) && last === i - 1);
      if (s === SID.ROW || s === SID.DBCELL || CELL_SIDS.has(s) || attached) last = i;
      else break;
    }
    if (first < 0) throw new XlsError('Il foglio "' + sh.name + '" è vuoto.');
    const blocks = [];
    let cur = null;
    const open = () => { cur = { rows: [], cells: [], dbOld: null }; blocks.push(cur); };
    for (let i = first; i <= last; i++) {
      const r = recs[i];
      if (r.sid === SID.ROW) {
        if (!cur || cur.cells.length || cur.dbOld) open();
        cur.rows.push({ rw: rd16(r.data, 0), data: r.data.slice() });
      } else if (r.sid === SID.DBCELL) {
        if (!cur || cur.dbOld) throw new XlsError('Struttura del foglio non riconosciuta (DBCELL).');
        cur.dbOld = r;
      } else if (CELL_SIDS.has(r.sid)) {
        if (!cur || cur.dbOld) open();
        cur.cells.push(cellFromRec(r));
      } else if (cur && cur.cells.length) {
        cur.cells[cur.cells.length - 1].extra.push({ sid: r.sid, data: r.data });
      } else {
        throw new XlsError('Record inatteso (0x' + r.sid.toString(16) + ') nella tabella delle celle.');
      }
    }
    const before = recs.slice(sh.start, first);
    const after = recs.slice(last + 1, sh.end + 1);
    const colinfo = before.filter(r => r.sid === SID.COLINFO).map(r => ({ c1: rd16(r.data, 0), c2: rd16(r.data, 2), xf: rd16(r.data, 6) }));
    const model = { book, sh, sheetIndex: book.sheets.indexOf(sh), blocks, before, after, colinfo, dirtyCells: new Map() };
    reindex(model);
    return model;
  }

  function reindex(m) {
    m.idx = new Map();
    m.rowInfo = new Map();
    m.blocks.forEach((b, bi) => {
      b.rows.forEach(r => m.rowInfo.set(r.rw, { block: bi, row: r }));
      b.cells.forEach(c => { for (let k = c.col; k <= c.colLast; k++) m.idx.set(c.row * 256 + k, c); });
    });
  }

  const key = (r, c) => r * 256 + c;

  function cellValue(m, r, c) {
    const k = key(r, c);
    if (m.dirtyCells.has(k)) return m.dirtyCells.get(k);
    const cell = m.idx.get(k);
    if (!cell) return { t: 'blank' };
    const d = cell.data;
    switch (cell.sid) {
      case SID.LABELSST: return { t: 's', v: m.book.sst[rd32(d, 6)] ?? '' };
      case SID.NUMBER: return { t: 'n', v: rdF64(d, 6) };
      case SID.RK: return { t: 'n', v: decodeRK(rd32(d, 6)) };
      case SID.MULRK: return { t: 'n', v: decodeRK(rd32(d, 4 + (c - cell.col) * 6 + 2)) };
      case SID.BOOLERR: return d[7] ? { t: 'e', v: d[6] } : { t: 'b', v: !!d[6] };
      case SID.LABEL: case SID.RSTRING: return { t: 's', v: readXLString(d, 6) };
      case SID.FORMULA: return formulaCached(cell);
      default: return { t: 'blank' };
    }
  }

  function formulaCached(cell) {
    const d = cell.data;
    if (rd16(d, 12) !== 0xFFFF) return { t: 'n', v: rdF64(d, 6) };
    switch (d[6]) {
      case 0: { const s = cell.extra.find(x => x.sid === SID.STRING); return { t: 's', v: s ? readXLString(s.data, 0) : '' }; }
      case 1: return { t: 'b', v: !!d[8] };
      case 2: return { t: 'e', v: d[8] };
      case 3: return { t: 's', v: '' };
      default: return { t: 'blank' };
    }
  }

  function cellXf(m, r, c) {
    const cell = m.idx.get(key(r, c));
    if (cell) {
      if (cell.sid === SID.MULBLANK) return rd16(cell.data, 4 + (c - cell.col) * 2);
      if (cell.sid === SID.MULRK) return rd16(cell.data, 4 + (c - cell.col) * 6);
      return rd16(cell.data, 4);
    }
    const ri = m.rowInfo.get(r);
    if (ri) {
      const fl = rd32(ri.row.data, 12);
      if (fl & 0x80) return (fl >>> 16) & 0x0FFF;
    }
    const ci = m.colinfo.find(x => c >= x.c1 && c <= x.c2);
    return ci ? ci.xf : 15;
  }

  function splitMul(m, cell) {
    const b = m.blocks[m.rowInfo.get(cell.row).block];
    const at = b.cells.indexOf(cell);
    const singles = [];
    for (let k = cell.col; k <= cell.colLast; k++) {
      if (cell.sid === SID.MULBLANK) {
        const d = new Uint8Array(6);
        wr16(d, 0, cell.row); wr16(d, 2, k); wr16(d, 4, rd16(cell.data, 4 + (k - cell.col) * 2));
        singles.push({ sid: SID.BLANK, data: d, row: cell.row, col: k, colLast: k, extra: [] });
      } else {
        const d = new Uint8Array(10);
        wr16(d, 0, cell.row); wr16(d, 2, k); d.set(cell.data.subarray(4 + (k - cell.col) * 6, 10 + (k - cell.col) * 6), 4);

  function encodeStringRecordBody(s) {

  // Scrive un valore costante in una cella (come "Incolla valori"), conservando il formato.
  function setValue(m, r, c, val) {
    const k = key(r, c);

    if (cell && (cell.sid === SID.MULBLANK || cell.sid === SID.MULRK)) { splitMul(m, cell); cell = m.idx.get(k); }

  function setFormulaCache(m, r, c, val) {

  function formulaTokens(m, cell) {

  // Riferimenti "grezzi" (anche per formule non valutabili), per sapere cosa dipende da cosa.
  function modelOf(book, idx) {

  }

  function formulaRects(m, cell) {
    const toks = formulaTokens(m, cell);
    if (toks) return toks.filter(t => (t.k === 'ref' || t.k === 'area') && (t.sheet === undefined || t.sheet === m.sheetIndex));

  function toNum(a) {

      case 346: {
        const list = cells(args[0]); if (!list) return { t: 'e', v: ERR.VALUE };
        const test = critMatch(val(args[1]));
        return { t: 'n', v: list.filter(test).length };
      }
    }
    throw new Unsupported('fn ' + f);
  }

  // Ricalcola le formule del foglio (come farebbe Excel) e aggiorna i valori memorizzati che cambiano.
  function recalc(m) {
    const formulas = [];
    for (const b of m.blocks) for (const c of b.cells) if (c.sid === SID.FORMULA) formulas.push(c);
    const same = (x, y) => {
      if (x.t === 'n' && y.t === 'n') return x.v === y.v || Math.abs(x.v - y.v) <= 1e-12 * Math.max(1, Math.abs(x.v));
      return sameVal(x, y);
    };
    const unsupported = new Set();
    const updated = new Set();
    for (let pass = 0; pass < 25; pass++) {
      let changed = false;
      for (const f of formulas) {
        if (unsupported.has(f)) continue;
        let v;
        try { v = evaluate(m, f); }
        catch (e) { if (!(e instanceof Unsupported)) throw e; unsupported.add(f); continue; }
        if (!same(v, cellValue(m, f.row, f.col))) { setFormulaCache(m, f.row, f.col, v); updated.add(f); changed = true; }
      }
      if (!changed) break;
    }
    return { updated: updated.size, skipped: [...unsupported].map(f => colName(f.col) + (f.row + 1)) };
  }

  // ---------------------------------------------------------- Serialize ----
  function serialize(book, model, addUncalced = true) {
    const { recs, sheets } = book;
    const out = []; // {sid, data, oldOff, tag}
    const push = (sid, data, oldOff, tag) => out.push({ sid, data, oldOff, tag });
    const sh = model ? model.sh : null;
    for (let i = 0; i < recs.length; i++) {
      const r = recs[i];
      if (sh && i === sh.start) {
        for (const x of model.before) {
          push(x.sid, x.data, x.off);
          if (addUncalced && x.sid === SID.BOF && x === model.before[0] && !model.before.some(y => y.sid === SID.UNCALCED)) push(SID.UNCALCED, new Uint8Array(2), null);
        }
        model.blocks.forEach(b => {
          b.rows.forEach(rw => push(SID.ROW, rw.data, null, { rowOf: b }));
          b.cells.forEach(c => {
            push(c.sid, c.data, null, { cellOf: b, row: c.row });
            c.extra.forEach(x => push(x.sid, x.data, null, { cellOf: b, row: c.row }));
          });
          if (b.dbOld) push(SID.DBCELL, new Uint8Array(4 + 2 * b.rows.length), b.dbOld.off, { dbcell: b });
        });
        for (const x of model.after) push(x.sid, x.data, x.off);
        i = sh.end;
        continue;
      }
      push(r.sid, r.data, r.off);
    }
    // posizioni
    let pos = 0;
    const map = new Map();
    for (const o of out) { o.newOff = pos; if (o.oldOff !== null && o.oldOff !== undefined) map.set(o.oldOff, pos); pos += 4 + o.data.length; }
    const total = pos + book.tail.length;
    const mapOff = old => {
      if (map.has(old)) return map.get(old);
      let best = null;
      for (const [k, v] of map) if (k >= old && (best === null || k < best[0])) best = [k, v];
      if (!best) throw new XlsError('Impossibile ricalcolare gli indici del file.');
      return best[1] - (best[0] - old);
    };
    // DBCELL del foglio modificato
    if (model) {
      model.blocks.filter(b => b.dbOld && b.rows.length).forEach(b => {
        const rowsRecs = out.filter(o => o.tag && o.tag.rowOf === b);
        const cellRecs = out.filter(o => o.tag && o.tag.cellOf === b);
        const db = out.find(o => o.tag && o.tag.dbcell === b);
        const d = db.data;
        const first = rowsRecs[0].newOff;
        wr32(d, 0, db.newOff - first);
        // come Excel: per ogni riga, distanza tra l'inizio delle sue celle e quello della riga precedente
        // (la prima distanza parte dal secondo record ROW; una riga senza celle "inizia" dove inizierebbe)
        let ref = first + 20;
        let cur = rowsRecs[rowsRecs.length - 1].newOff + 4 + rowsRecs[rowsRecs.length - 1].data.length;
        b.rows.forEach((rw, i) => {
          wr16(d, 4 + i * 2, cur - ref);
          ref = cur;
          for (const o of cellRecs) if (o.tag.row === rw.rw) cur += 4 + o.data.length;
        });
      });
    }
    // BOUNDSHEET e INDEX
    const buf = new Uint8Array(total);
    for (const o of out) {
      let d = o.data;
      if (o.sid === SID.BOUNDSHEET) { d = d.slice(); wr32(d, 0, mapOff(rd32(d, 0))); }
      else if (o.sid === SID.INDEX) {
        d = d.slice();
        wr32(d, 12, mapOff(rd32(d, 12)));
        for (let k = 16; k + 4 <= d.length; k += 4) wr32(d, k, mapOff(rd32(d, k)));
      }
      wr16(buf, o.newOff, o.sid); wr16(buf, o.newOff + 2, d.length);
      buf.set(d, o.newOff + 4);
    }
    buf.set(book.tail, pos);
    return buf;
  }

  // ------------------------------------------------------------- Public ----
  const ROLES = ['P', 'D', 'C', 'A'];

  function looksLikeTeamSheet(book, sh) {
    if (sh.type !== 0) return false;
    let ok = 0;
    try {
      const m = buildSheet(book, sh);
      for (let r = 0; r < 31; r++) {
        const a = cellValue(m, r, 0), b = cellValue(m, r, 1);
        if (a.t === 'n' && a.v === r + 1 && b.t === 's' && ROLES.includes(b.v.trim().toUpperCase())) ok++;
      }
      const h = m.idx.get(key(4, 8));
      return ok >= 25 && !!h && h.sid === SID.FORMULA;
    } catch (e) { return false; }
  }

  function load(u8) {
    const book = openWorkbook(u8);
    const teamSheets = book.sheets.filter(s => looksLikeTeamSheet(book, s)).map(s => s.name);
    return {
      sheetNames: teamSheets,
      allSheets: book.sheets.map(s => s.name),
      roster(name) { return readRoster(book, name); },
      clubs() { return readListone(book); },
      has(name) { return book.sheets.some(s => s.name === name); },
      // Lettura libera di un foglio: serve al file di giornata (classifiche, calendario, voti...)
      grid(name) {
        const m = buildSheet(book, sheetByName(book, name));
        const get = (r, c) => { const v = freshValue(m, r, c); return v.t === 'blank' || v.t === 'e' ? null : v.v; };
        return {
          get,
          num(r, c) { const v = get(r, c); return typeof v === 'number' ? v : null; },
          str(r, c) { const v = get(r, c); return typeof v === 'string' ? v.trim() : (v == null || v === false ? '' : String(v)); },
          // cerca un testo nella zona indicata e ritorna {r, c}
          find(re, r0, r1, c0, c1) {
            for (let r = r0; r < r1; r++) for (let c = c0; c < c1; c++) {
              const v = get(r, c);
              if (typeof v === 'string' && re.test(v.trim())) return { r, c };
            }
            return null;
          },
          findAll(re, r0, r1, c0, c1) {
            const out = [];
            for (let r = r0; r < r1; r++) for (let c = c0; c < c1; c++) {
              const v = get(r, c);
              if (typeof v === 'string' && re.test(v.trim())) out.push({ r, c });
            }
            return out;
          }
        };
      },
      build(name, numbers) { return buildFile(book, name, numbers); },
      _book: book
    };
  }

  function sheetByName(book, name) {
    const sh = book.sheets.find(s => s.name === name);
    if (!sh) throw new XlsError('Foglio "' + name + '" non trovato.');
    return sh;
  }

  // Valore "fresco" di una cella: se è una formula valutabile la ricalcola (utile con file salvati
  // da programmi che non memorizzano i risultati testuali), altrimenti usa il valore memorizzato.
  function freshValue(m, r, c) {
    const cell = m.idx.get(key(r, c));
    if (cell && cell.sid === SID.FORMULA && !m.dirtyCells.has(key(r, c))) {
      try { return evaluate(m, cell); } catch (e) { if (!(e instanceof Unsupported)) throw e; }
    }
    return cellValue(m, r, c);
  }

  function readRoster(book, name) {
    const m = buildSheet(book, sheetByName(book, name));
    const players = [];
    for (let r = 0; r < 31; r++) {
      const a = freshValue(m, r, 0), b = freshValue(m, r, 1), c = freshValue(m, r, 2), d = cellValue(m, r, 3);
      players.push({
        row: r,
        a: a.t === 'n' ? a.v : r + 1,
        role: b.t === 's' ? b.v.trim().toUpperCase() : '',
        name: c.t === 's' ? c.v.trim() : (c.t === 'n' ? String(c.v) : ''),
        number: d.t === 'n' ? d.v : null
      });
    }
    return players;
  }

  // Listone: un foglio con le colonne Ruolo | Nome | Squadra. Serve solo a sapere
  // in che squadra di Serie A gioca chi è in rosa (per il blocco partita per partita).
  // Ritorna una mappa "nome|ruolo" -> squadra, più la chiave "nome" da sola.
  const plainName = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[.'`’-]/g, ' ').replace(/\s+/g, ' ').trim();

  function readListone(book) {
    const out = new Map();
    for (const sh of book.sheets) {
      if (sh.type !== 0) continue;
      let m;
      try { m = buildSheet(book, sh); } catch (e) { continue; }
      let head = -1;
      for (let r = 0; r < 6 && head < 0; r++) {
        const a = cellValue(m, r, 0), b = cellValue(m, r, 1), c = cellValue(m, r, 2);
        if (a.t === 's' && b.t === 's' && c.t === 's' &&
            /ruol/i.test(a.v) && /nom/i.test(b.v) && /squadr/i.test(c.v)) head = r;
      }
      if (head < 0) continue;
      let vuote = 0;
      for (let r = head + 1; vuote < 40 && r < head + 2000; r++) {
        const ro = freshValue(m, r, 0), nm = freshValue(m, r, 1), cl = freshValue(m, r, 2);
        const name = nm.t === 's' ? nm.v.trim() : '';
        const club = cl.t === 's' ? cl.v.trim() : '';
        if (!name || !club) { vuote++; continue; }
        vuote = 0;
        const role = ro.t === 's' ? ro.v.trim().toUpperCase() : '';
        const k = plainName(name);
        out.set(k + '|' + role, club);
        if (!out.has(k)) out.set(k, club);
      }
    }
    return out;
  }

  // numbers: array di 31 elementi (numero o null) per le righe 1..31 della colonna D.
  function buildFile(book, name, numbers) {
    const sh = sheetByName(book, name);
    const m = buildSheet(book, sh);
    // 0) allinea i valori memorizzati delle formule in A1:G31 (se il file li ha persi)
    for (let r = 0; r < 31; r++) for (let c = 0; c < 7; c++) {
      if (c === 3) continue;
      const cell = m.idx.get(key(r, c));
      if (!cell || cell.sid !== SID.FORMULA) continue;
      const f = freshValue(m, r, c);
      if (!sameVal(f, cellValue(m, r, c))) setFormulaCache(m, r, c, f);
    }
    // 1) colonna D
    for (let r = 0; r < 31; r++) {
      const n = numbers[r];
      setValue(m, r, 3, n === null || n === undefined || n === '' ? { t: 'blank' } : { t: 'n', v: +n });
    }
    // 2) replica della macro "Formazioni": ordina A1:G31 per D (vuoti in fondo) poi A,
    //    copia valori B1:C22 -> H31:I52 e F1:G22 -> J31:K52
    const rows = [];
    for (let r = 0; r < 31; r++) {
      const vals = [];
      for (let c = 0; c < 7; c++) vals.push(cellValue(m, r, c));
      rows.push({ r, vals });
    }
    const sortKey = v => v.t === 'blank' ? [4] : v.t === 'n' ? [0, v.v] : v.t === 's' ? [1, v.v.toLowerCase()] : v.t === 'b' ? [2, +v.v] : [3, 0];
    const cmpKeys = (x, y) => {
      for (let i = 0; i < Math.max(x.length, y.length); i++) {
        if (x[i] === undefined) return -1;
        if (y[i] === undefined) return 1;
        if (x[i] < y[i]) return -1;
        if (x[i] > y[i]) return 1;
      }
      return 0;
    };
    rows.sort((p, q) => cmpKeys(sortKey(p.vals[3]), sortKey(q.vals[3])) || cmpKeys(sortKey(p.vals[0]), sortKey(q.vals[0])) || p.r - q.r);
    const pasteVal = v => (v.t === 'n' || v.t === 's' || v.t === 'b') ? (v.t === 'b' ? { t: 'n', v: +v.v } : v) : { t: 'blank' };
    for (let i = 0; i < 22; i++) {
      const src = rows[i].vals;
      setValue(m, 30 + i, 7, pasteVal(src[1]));
      setValue(m, 30 + i, 8, pasteVal(src[2]));
      setValue(m, 30 + i, 9, pasteVal(src[5]));
      setValue(m, 30 + i, 10, pasteVal(src[6]));
    }
    // 3) aggiorna i valori calcolati delle formule che dipendono dalle celle cambiate
    const rc = recalc(m);
    // 4) serializza
    const wb = serialize(book, m);
    const outFile = cfbReplaceStream(book.cfb, book.ent, wb);
    // 5) verifica: rileggi il file e controlla le celle scritte
    const check = openWorkbook(outFile);
    const m2 = buildSheet(check, sheetByName(check, name));
    for (let r = 0; r < 31; r++) {
      const d = cellValue(m2, r, 3);
      const want = numbers[r];
      if ((want === null || want === undefined || want === '') ? d.t !== 'blank' : !(d.t === 'n' && d.v === +want)) throw new XlsError('Verifica fallita sulla cella D' + (r + 1) + '.');
    }
    for (const s of check.sheets) if (check.recs[s.start].sid !== SID.BOF) throw new XlsError('Verifica fallita sugli indici dei fogli.');
    const lineup = [];
    for (let i = 0; i < 22; i++) {
      const h = cellValue(m2, 30 + i, 7), n = cellValue(m2, 30 + i, 8);
      lineup.push({ pos: i + 1, role: h.t === 's' ? h.v : '', name: n.t === 's' ? n.v : '' });
    }
    const shown = [];
    for (let r = 4; r <= 28; r++) { const v = cellValue(m2, r, 8); shown.push(v.t === 's' ? v.v : v.t === 'n' ? String(v.v) : ''); }
    const modulo = [cellValue(m2, 1, 8), cellValue(m2, 1, 9), cellValue(m2, 1, 10)].map(v => v.t === 'n' ? v.v : null);
    return { bytes: outFile, lineup, shown, modulo, recalc: rc };
  }

  const api = { load, XlsError, norm: plainName, _internals: { readCFB, openWorkbook, buildSheet, serialize, cfbReplaceStream, cellValue, recalc, parseRecords, evaluate, SID } };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.XlsFormazione = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Lettura del file .xls di giornata della lega ("03 Campionato - Terza Giornata.xls").
 *
 * Da un solo file escono tutti i dati del sito: voti dei giocatori, risultati e
 * calendario, formazioni realmente schierate con subentri e marcatori,
 * classifiche, superclassifica, gol reali, rose e crediti.
 *
 * Nessuna libreria: legge i fogli con il motore .xls già usato da Schiera.
 * I fogli non vengono cercati per posizione fissa ma per intestazione, così il
 * file può cambiare qualche riga senza rompere tutto.
 */
(function (root) {
  'use strict';

  const X = root.XlsFormazione || (typeof require === 'function' ? require('../../schiera-formazione/src/engine.js') : null);

  class GiornataError extends Error {}

  const NOSPACE = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const num = v => (typeof v === 'number' && isFinite(v) ? v : null);
  const txt = v => (typeof v === 'string' ? v.trim() : (typeof v === 'number' ? String(v) : ''));

  // I fogli squadra del file: quelli con la rosa numerata 1..31
  function teamSheets(wb) {
    return wb.sheetNames.slice();
  }

  // ------------------------------------------------------------------ voti
  // Foglio "voti": ID | SQUADRA | RUOLO | NOME | V | FV
  function readVoti(wb) {
    if (!wb.has('voti')) return [];
    const g = wb.grid('voti');
    const out = [];
    for (let r = 1; r < 600; r++) {
      const id = g.num(r, 0);
      if (id == null) break;
      const nome = g.str(r, 3);
      if (!nome) continue;
      out.push({
        squadra: g.str(r, 1),
        ruolo: g.str(r, 2).toUpperCase(),
        nome,
        voto: g.num(r, 4),
        fantavoto: g.num(r, 5)
      });
    }
    return out;
  }

  // ------------------------------------------------------------- calendario
  // Blocchi "GIORNATA n" con 4 partite: casa | trasferta | gol | gol.
  // Nella fase a orologio, finché la classifica non è definitiva, al posto dei
  // nomi ci sono le posizioni (1..8): le teniamo come sono.
  function readCalendario(wb) {
    if (!wb.has('CALENDARIO')) return [];
    const g = wb.grid('CALENDARIO');
    const out = [];
    g.findAll(/^GIORNATA$/i, 0, 60, 0, 24).forEach(({ r, c }) => {
      const n = g.num(r, c + 2);
      if (n == null) return;
      for (let k = 3; k <= 6; k++) {
        const casa = g.get(r + k, c), fuori = g.get(r + k, c + 1);
        if (casa == null && fuori == null) continue;
        const gc = g.num(r + k, c + 2), gf = g.num(r + k, c + 3);
        out.push({
          giornata: n,
          casa: typeof casa === 'number' ? null : txt(casa),
          fuori: typeof fuori === 'number' ? null : txt(fuori),
          pos_casa: typeof casa === 'number' ? casa : null,
          pos_fuori: typeof fuori === 'number' ? fuori : null,
          gol_casa: gc, gol_fuori: gf,
          giocata: gc != null && gf != null
        });
      }
    });
    out.sort((a, b) => a.giornata - b.giornata);
    return out;
  }

  // -------------------------------------------------- foglio di una squadra
  // Restituisce formazione risultante, punteggi, sostituzioni e marcatori.
  function readTeamSheet(wb, name) {
    const g = wb.grid(name);

    // rosa + numeri schierati + voti (colonne A..G)
    const rosa = [];
    for (let r = 0; r < 31; r++) {
      const nome = g.str(r, 2);
      rosa.push({
        slot: r + 1,
        ruolo: g.str(r, 1).toUpperCase(),
        nome,
        numero: g.num(r, 3),
        voto: g.num(r, 5),
        fantavoto: g.num(r, 6)
      });
    }

    // blocco del risultato: "Nome | Voto | Fantavoto" con i 18 posti in ordine
    const head = g.find(/^Nome$/i, 0, 12, 6, 14);
    const formazione = [];
    let totali = null;
    if (head) {
      const c = head.c;                     // colonna dei nomi
      for (let k = 1; k <= 24; k++) {
        const r = head.r + k;
        const et = g.str(r, c);
        if (/^totale$/i.test(et)) {
          totali = { voti: g.num(r, c + 1), fantavoti: g.num(r, c + 2), avversario: g.num(r, c + 3) };
          break;
        }
        if (!et) continue;
        formazione.push({
          pos: formazione.length + 1,
          ruolo: g.str(r, c - 1).toUpperCase(),
          nome: et,
          voto: g.num(r, c + 1),
          fantavoto: g.num(r, c + 2),
          giocato: g.num(r, c + 2) != null
        });
      }
    }

    // riquadro della partita: l'etichetta "Coppa di Lega" con i due valori a fianco
    const partita = { casa: null, fuori: null };
    const lab = g.find(/^Coppa di Lega$/i, 0, 14, 10, 20);
    if (lab) {
      const c = lab.c, r = lab.r;
      const nomi = [g.str(r - 1, c + 1), g.str(r - 1, c + 2)];
      const leggi = re => { const x = g.find(re, r - 1, r + 12, c, c + 1); return x ? [g.num(x.r, c + 1), g.num(x.r, c + 2)] : [null, null]; };
      const cdl = [g.num(r, c + 1), g.num(r, c + 2)];
      const campo = leggi(/^Fattore campo$/i);
      const modulo = leggi(/^Modulo$/i);
      const totale = leggi(/^Totale$/i);
      const risultato = leggi(/^RISULTATO$/i);
      partita.casa = { squadra: nomi[0], punteggio: cdl[0], fattore_campo: campo[0], bonus_modulo: modulo[0], totale: totale[0], gol: risultato[0] };
      partita.fuori = { squadra: nomi[1], punteggio: cdl[1], fattore_campo: campo[1], bonus_modulo: modulo[1], totale: totale[1], gol: risultato[1] };
    }

    // sostituzioni per reparto
    const sost = {};
    const sl = g.find(/^Sostituzioni$/i, 0, 30, 10, 20);
    if (sl) {
      const mappa = { 'portieri:': 'P', 'difensori:': 'D', 'centrocampisti:': 'C', 'attaccanti:': 'A', 'totale:': 'tot' };
      for (let k = 1; k <= 8; k++) {
        const et = g.str(sl.r + k, sl.c).toLowerCase();
        const key = mappa[et];
        if (key) sost[key] = g.num(sl.r + k, sl.c + 1);
      }
    }

    // marcatori: una riga con i nomi separati da virgola, oppure un nome per riga
    const marcatori = [];
    const ml = g.find(/^Marcatori$/i, 0, 40, 10, 20);
    if (ml) {
      for (let k = 1; k <= 12; k++) {
        const v = g.str(ml.r + k, ml.c);
        if (!v) { if (k > 1) break; else continue; }
        v.split(',').forEach(x => { if (x.trim()) marcatori.push(x.trim()); });
      }
    }

    const modulo = (() => {
      const m = g.find(/^Modulo$/i, 0, 4, 6, 14);
      if (!m) return '';
      const a = g.num(m.r + 1, m.c - 1), b = g.num(m.r + 1, m.c), c = g.num(m.r + 1, m.c + 1);
      return [a, b, c].every(x => x != null) ? [a, b, c].join('-') : '';
    })();

    return { squadra: name, rosa, formazione, totali, partita, sostituzioni: sost, marcatori, modulo };
  }

  // ------------------------------------------------------------- classifiche
  function readClassifiche(wb) {
    const out = { giornata: null, campionato: [], coppa_lega: null, sfigometro: null, cannonieri: [] };
    if (!wb.has('CLASSIFICHE')) return out;
    const g = wb.grid('CLASSIFICHE');

    const camp = g.find(/^CAMPIONATO$/i, 0, 6, 0, 3);
    if (camp) {
      out.giornata = g.num(camp.r, camp.c + 4);
      for (let k = 3; k <= 12; k++) {
        const nome = g.str(camp.r + k, 0);
        if (!nome) continue;
        if (g.num(camp.r + k, 3) == null) continue;
        out.campionato.push({
          squadra: nome,
          punti: g.num(camp.r + k, 1), mi: g.num(camp.r + k, 2),
          g: g.num(camp.r + k, 3), v: g.num(camp.r + k, 4), n: g.num(camp.r + k, 5), p: g.num(camp.r + k, 6),
          gf: g.num(camp.r + k, 7), gs: g.num(camp.r + k, 8), dr: g.num(camp.r + k, 9),
          casa: { g: g.num(camp.r + k, 10), v: g.num(camp.r + k, 11), n: g.num(camp.r + k, 12), p: g.num(camp.r + k, 13), gf: g.num(camp.r + k, 14), gs: g.num(camp.r + k, 15) },
          fuori: { g: g.num(camp.r + k, 16), v: g.num(camp.r + k, 17), n: g.num(camp.r + k, 18), p: g.num(camp.r + k, 19), gf: g.num(camp.r + k, 20), gs: g.num(camp.r + k, 21) }
        });
      }
    }

    // Coppa di Lega e Sfigometro: due tabelle uguali (settimanali + totali)
    const serie = (titolo) => {
      const h = g.find(titolo, 0, 120, 0, 2);
      if (!h) return null;
      const blocco = (re) => {
        const b = g.find(re, h.r, h.r + 20, 0, 2);
        if (!b) return null;
        const giornate = [];
        for (let c = 7; c < 30; c++) { const n = g.num(b.r, c); if (n == null) break; giornate.push({ n, c }); }
        const righe = [];
        for (let k = 1; k <= 12; k++) {
          const squadra = g.str(b.r + k, 5);
          if (!squadra) continue;
          const per = {};
          giornate.forEach(({ n, c }) => { const v = g.num(b.r + k, c); if (v != null) per[n] = v; });
          righe.push({ squadra, per_giornata: per });
        }
        const ordine = [];
        for (let k = 1; k <= 12; k++) {
          const squadra = g.str(b.r + k, 0);
          const v = g.num(b.r + k, 1);
          if (squadra && v != null) ordine.push({ squadra, valore: v });
        }
        return { righe, ordine };
      };
      return { settimanali: blocco(/^SETTIMANALI$/i), totali: blocco(/^TOTALI$/i) };
    };
    out.coppa_lega = serie(/^COPPA DI LEGA$/i);
    out.sfigometro = serie(/^SFIGOMETRO$/i);

    // cannonieri: "n | Nome (SG)" ripetuto su più colonne
    const can = g.find(/^CLASSIFICA CANNONIERI/i, 0, 200, 0, 2);
    if (can) {
      let gol = null;
      for (let r = can.r + 1; r < can.r + 80; r++) {
        const n = g.num(r, 0);
        if (n != null) gol = n;
        if (gol == null) continue;
        for (let c = 1; c < 16; c++) {
          const v = g.str(r, c);
          const m = /^(.+?)\s*\(([A-Z0-9]{2})\)$/.exec(v);
          if (m) out.cannonieri.push({ nome: m[1].trim(), sigla: m[2], gol });
        }
      }
    }
    return out;
  }

  // ---------------------------------------------------------- superclassifica
  function readSuperclassifica(wb) {
    const out = {};
    if (!wb.has('SUPERCLASSIFICA')) return out;
    const g = wb.grid('SUPERCLASSIFICA');
    const semplice = (re, cols) => {
      const h = g.find(re, 0, 80, 0, 2);
      if (!h) return [];
      const righe = [];
      for (let k = 1; k <= 12; k++) {
        const squadra = g.str(h.r + k, 0);
        if (!squadra) { if (righe.length) break; else continue; }
        const o = { squadra };
        Object.keys(cols).forEach(nome => { o[nome] = g.num(h.r + k, cols[nome]); });
        righe.push(o);
      }
      return righe;
    };
    const corretta = () => {
      const h = g.find(/^CLASSIFICA CAMPIONATO\s*.CORRETTA/i, 0, 20, 0, 12);
      if (!h) return [];
      const righe = [];
      for (let k = 1; k <= 12; k++) {
        const squadra = g.str(h.r + k, h.c);
        const v = g.num(h.r + k, h.c + 1);
        if (!squadra || v == null) { if (righe.length) break; else continue; }
        righe.push({ squadra, totale: v });
      }
      return righe;
    };
    out.campionato_standard = semplice(/^CLASSIFICA CAMPIONATO\s*.STANDARD/i, { punti: 1, bonus: 2, totale: 3 });
    out.campionato_corretta = corretta();
    const conPremio = { totale: 1, media: 2, arrotondato: 3, premio: 4, definitivo: 5 };
    out.coppa_lega = semplice(/^CLASSIFICA COPPA DI LEGA$/i, conPremio);
    out.sfigometro = semplice(/^CLASSIFICA SFIGOMETRO$/i, conPremio);
    out.gol_totali = semplice(/^CLASSIFICA GOL REALI FATTI TOTALI/i, conPremio);
    out.gol_sfruttati = semplice(/^CLASSIFICA GOL REALI FATTI SFRUTTATI/i, conPremio);
    return out;
  }

  // --------------------------------------------------------------- gol reali
  // 8 blocchi da 3 colonne: riga 1 squadra | sfruttati | totali, poi i giocatori.
  function readGolReali(wb) {
    if (!wb.has('GOL REALI')) return [];
    const g = wb.grid('GOL REALI');
    const out = [];
    for (let b = 0; b < 12; b++) {
      const c = b * 3;
      const squadra = g.str(0, c);
      if (!squadra) break;
      const giocatori = [];
      for (let r = 1; r < 60; r++) {
        const nome = g.str(r, c);
        if (!nome) continue;
        const sf = g.num(r, c + 1), tt = g.num(r, c + 2);
        if (sf != null || tt != null) giocatori.push({ nome, sfruttati: sf || 0, totali: tt || 0 });
      }
      out.push({ squadra, sfruttati: g.num(0, c + 1), totali: g.num(0, c + 2), giocatori });
    }
    return out;
  }

  // ------------------------------------------------------------ rose e crediti
  function readRose(wb) {
    if (!wb.has('ROSE')) return { rose: [], crediti: [] };
    const g = wb.grid('ROSE');
    const rose = [], crediti = [];
    for (let b = 0; b < 12; b++) {
      const c = b * 3;
      const squadra = g.str(0, c);
      if (!squadra) break;
      crediti.push({ squadra, crediti: g.num(0, c + 1) });
      for (let r = 1; r <= 31; r++) {
        const nome = g.str(r, c);
        if (!nome) continue;
        rose.push({ squadra, slot: r, nome, costo: g.num(r, c + 1), valore: g.num(r, c + 2) });
      }
    }
    return { rose, crediti };
  }

  // ------------------------------------------------------------------- coppa
  function readCoppa(wb) {
    if (!wb.has('COPPA')) return null;
    const g = wb.grid('COPPA');
    const blocco = (re) => {
      const h = g.find(re, 0, 40, 0, 16);
      if (!h) return [];
      const righe = [];
      for (let k = 1; k <= 12; k++) {
        const squadra = g.str(h.r + k, h.c);
        const valore = g.num(h.r + k, h.c + 1);
        const punti = g.num(h.r + k, h.c + 2);
        if (!squadra || punti == null) { if (righe.length) break; else continue; }
        righe.push({ squadra, valore, punti });
      }
      return righe;
    };
    const quarti = [];
    const q = g.find(/^COPPA$/i, 0, 30, 10, 20);
    if (q) {
      for (let k = 1; k <= 12; k++) {
        const squadra = g.str(q.r + k, q.c), punti = g.num(q.r + k, q.c + 1);
        if (!squadra || punti == null) { if (quarti.length) break; else continue; }
        quarti.push({ squadra, punti });
      }
    }
    return {
      campionato: blocco(/^CAMPIONATO$/i),
      coppa_lega: blocco(/^COPPA DI LEGA$/i),
      gol_reali: blocco(/^GOL REALI$/i),
      crediti: blocco(/^CREDITI RESIDUI$/i),
      quarti
    };
  }

  // ---------------------------------------------------------------- albo d'oro
  function readAlbo(wb) {
    if (!wb.has("ALBO D'ORO")) return [];
    const g = wb.grid("ALBO D'ORO");
    const h = g.find(/^CAMPIONATO$/i, 0, 12, 0, 8);
    if (!h) return [];
    const out = [];
    for (let r = h.r + 1; r < h.r + 60; r++) {
      const st = g.str(r, h.c - 1);
      if (!/^\d{4}\/\d{2}$/.test(st)) continue;
      out.push({
        stagione: st,
        campionato: g.str(r, h.c),
        coppa: g.str(r, h.c + 1),
        coppa_lega: g.str(r, h.c + 2),
        supercoppa: g.str(r, h.c + 3)
      });
    }
    return out;
  }

  // --------------------------------------------------------------------- tutto
  function parse(bytes, fileName) {
    const wb = X.load(bytes);
    if (!wb.has('CLASSIFICHE') && !wb.has('CALENDARIO')) {
      throw new GiornataError('Questo non sembra il file di giornata della lega: mancano i fogli CALENDARIO e CLASSIFICHE.');
    }
    const classifiche = readClassifiche(wb);
    const calendario = readCalendario(wb);
    const squadre = teamSheets(wb);
    const giocate = calendario.filter(m => m.giocata).map(m => m.giornata);
    const giornata = classifiche.giornata != null ? classifiche.giornata
      : (giocate.length ? Math.max.apply(null, giocate) : null);
    if (giornata == null) throw new GiornataError('Non riesco a capire a quale giornata si riferisce il file.');

    const fogli = squadre.map(n => readTeamSheet(wb, n));
    const rose = readRose(wb);

    // una riga per squadra con il suo risultato di giornata
    const squadre_giornata = fogli.map(f => {
      const p = f.partita || {};
      const io = p.casa && NOSPACE(p.casa.squadra) === NOSPACE(f.squadra) ? p.casa
        : p.fuori && NOSPACE(p.fuori.squadra) === NOSPACE(f.squadra) ? p.fuori : null;
      const avv = io === p.casa ? p.fuori : p.casa;
      return {
        squadra: f.squadra,
        modulo: f.modulo,
        in_casa: io === p.casa,
        avversario: avv ? avv.squadra : null,
        punteggio: io ? io.punteggio : (f.totali ? f.totali.fantavoti : null),
        somma_voti: f.totali ? f.totali.voti : null,
        fattore_campo: io ? io.fattore_campo : null,
        bonus_modulo: io ? io.bonus_modulo : null,
        totale: io ? io.totale : null,
        gol_fatti: io ? io.gol : null,
        gol_subiti: avv ? avv.gol : null,
        sostituzioni: f.sostituzioni,
        marcatori: f.marcatori,
        formazione: f.formazione,
        schierati: f.rosa.filter(x => x.numero != null && x.nome)
          .sort((a, b) => a.numero - b.numero)
          .map(x => ({ pos: x.numero, slot: x.slot, ruolo: x.ruolo, nome: x.nome, voto: x.voto, fantavoto: x.fantavoto }))
      };
    });

    const voti = readVoti(wb).length ? readVoti(wb) : [].concat.apply([], fogli.map(f =>
      f.rosa.filter(x => x.nome).map(x => ({ squadra: f.squadra, ruolo: x.ruolo, nome: x.nome, voto: x.voto, fantavoto: x.fantavoto }))));

    return {
      file: fileName || '',
      giornata,
      serie_a: giornata + 2,          // la 1ª di lega è la 3ª di Serie A
      squadre,
      calendario,
      squadre_giornata,
      voti,
      rose: rose.rose,
      crediti: rose.crediti,
      classifica: classifiche.campionato,
      coppa_lega: classifiche.coppa_lega,
      sfigometro: classifiche.sfigometro,
      cannonieri: classifiche.cannonieri,
      superclassifica: readSuperclassifica(wb),
      gol_reali: readGolReali(wb),
      coppa: readCoppa(wb),
      albo: readAlbo(wb)
    };
  }

  const api = { parse, GiornataError, _parts: { readVoti, readCalendario, readTeamSheet, readClassifiche, readSuperclassifica, readGolReali, readRose, readCoppa, readAlbo } };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Giornata = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Il Solito Culo — il sito della lega.
 * Rose, calendario, classifiche, statistiche, coppe, playoff, albo d'oro.
 * I dati arrivano dal database (Supabase), alimentato dal file .xls di giornata. */
(function () {
  'use strict';

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ROLE = { P: 'Portieri', D: 'Difensori', C: 'Centrocampisti', A: 'Attaccanti' };
  const LS = 'ilsolitoculo:v1';
  const n1 = v => (v == null || v === '' ? '—' : (Math.round(v * 100) / 100).toString().replace('.', ','));
  const nz = v => (v == null ? 0 : +v);

  const S = {
    profile: null, team: null, teams: [], rounds: [], matches: [],
    cache: {}, sezione: '', pronta: false
  };

  const prefs = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
  const setPrefs = p => { try { localStorage.setItem(LS, JSON.stringify(p)); } catch (e) { /* ok */ } };

  const teamById = id => S.teams.find(t => t.id === id) || null;
  // "MarcoI" si legge male: sullo schermo diventa "Marco I"
  const bel = n => String(n || '').replace(/([a-zà-ÿ])(I+)$/, '$1 $2');
  const teamName = id => { const t = teamById(id); return t ? bel(t.name) : '\u2014'; };
  const isMe = id => !!(S.team && id === S.team.id);
  const isAdmin = () => !!(S.profile && S.profile.role === 'admin');
  const giocate = () => S.rounds.filter(r => r.giocata);
  const ultima = () => { const g = giocate(); return g.length ? g[g.length - 1] : null; };

  // ------------------------------------------------------------------ dati
  async function carica(chiave, fn) {
    if (S.cache[chiave] === undefined) S.cache[chiave] = await fn();
    return S.cache[chiave];
  }

  async function caricaBase() {
    const uid = (SB.user() || {}).id || ((await SB.me()) || {}).id;
    const prof = (await SB.select('profiles', 'select=display_name,role,team_id&id=eq.' + uid))[0];
    if (!prof) throw new SB.SbError('Profilo non trovato: scrivi all’amministratore.', 'no_profile');
    S.profile = prof;
    S.teams = await SB.select('teams', 'select=id,name,sheet_name&order=name');
    S.team = S.teams.find(t => t.id === prof.team_id) || null;
    S.rounds = await SB.select('rounds', 'select=id,serie_a,fase,label,giocata,caricata_at&order=id');
    S.matches = await SB.select('matches', 'select=round,slot,casa,fuori,pos_casa,pos_fuori,gol_casa,gol_fuori,punti_casa,punti_fuori,totale_casa,totale_fuori,modulo_casa,modulo_fuori&competizione=eq.campionato&order=round,slot');
    S.cache = {};
    S.pronta = true;
  }

  const classifiche = tipo => carica('st:' + tipo, () =>
    SB.select('standings', 'select=round,team_id,pos,valore,dati&tipo=eq.' + tipo + '&order=round,pos'));
  const tabellini = round => carica('rt:' + round, () =>
    SB.select('round_teams', 'select=*&round=eq.' + round));
  const rose = () => carica('players', () =>
    SB.select('players', 'select=id,team_id,slot,role,name,club&order=team_id,slot'));
  const costi = () => carica('costi', () => SB.select('roster_costs', 'select=team_id,slot,nome,costo,valore'));
  const statGiocatori = () => carica('pstats', () => SB.select('player_stats', 'select=*'));
  const marcatori = () => carica('scorers', async () => {
    const u = ultima();
    return u ? SB.select('scorers', 'select=team_id,nome,gol,gol_sfruttati&round=eq.' + u.id + '&order=gol.desc') : [];
  });
  const stagione = () => carica('season', async () => {
    const u = ultima();
    return u ? SB.select('team_season', 'select=team_id,crediti,gol_totali,gol_sfruttati&round=eq.' + u.id) : [];
  });
  const alboDoro = () => carica('albo', () => SB.select('albo', 'select=*&order=stagione.desc'));

  // ------------------------------------------------- calcoli fatti in casa
  // Punti accumulati giornata per giornata (3 vittoria, 1 pareggio): serve al grafico.
  function andamento() {
    const per = new Map(S.teams.map(t => [t.id, []]));
    const tot = new Map(S.teams.map(t => [t.id, 0]));
    giocate().forEach(r => {
      S.matches.filter(m => m.round === r.id && m.gol_casa != null).forEach(m => {
        const a = m.gol_casa, b = m.gol_fuori;
        if (m.casa) tot.set(m.casa, nz(tot.get(m.casa)) + (a > b ? 3 : a === b ? 1 : 0));
        if (m.fuori) tot.set(m.fuori, nz(tot.get(m.fuori)) + (b > a ? 3 : a === b ? 1 : 0));
      });
      S.teams.forEach(t => per.get(t.id).push({ x: r.id, y: tot.get(t.id) }));
    });
    return per;
  }

  function partiteDi(teamId) {
    return S.matches.filter(m => m.casa === teamId || m.fuori === teamId);
  }

  // ------------------------------------------------------------- grafici
  // Una linea in evidenza (la squadra scelta) e le altre come sfondo grigio:
  // niente spaghetti di otto colori su uno schermo da telefono.
  function grafico(serie, opts) {
    opts = opts || {};
    const W = 360, H = opts.h || 190, ML = 24, MR = 64, MT = 12, MB = 22;
    const punti = [].concat.apply([], serie.map(s => s.punti));
    if (punti.length < 2) return '<p class="empty">Servono almeno due giornate per il grafico.</p>';
    const xs = punti.map(p => p.x), ys = punti.map(p => p.y);
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    let y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    if (opts.inverti) { const t = y0; y0 = y1; y1 = t; }
    if (y0 === y1) { y1 = y0 + 1; }
    const X = v => ML + (W - ML - MR) * (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0));
    const Y = v => MT + (H - MT - MB) * (1 - (v - y0) / (y1 - y0));
    const path = s => s.punti.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');

    const griglia = [];
    const passo = Math.max(1, Math.round(Math.abs(y1 - y0) / 4));
    for (let v = Math.min(y0, y1); v <= Math.max(y0, y1) + 0.001; v += passo) {
      griglia.push(`<line x1="${ML}" x2="${W - MR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--chart-grid)" stroke-width="1"/>` +
        `<text x="${ML - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`);
    }
    const assex = [];
    for (let v = x0; v <= x1; v++) {
      if (x1 - x0 > 9 && v % 2 === 0) continue;
      assex.push(`<text x="${X(v).toFixed(1)}" y="${H - 6}" text-anchor="middle">${v}</text>`);
    }
    const sfondo = serie.filter(s => !s.evidenzia).map(s =>
      `<path d="${path(s)}" fill="none" stroke="var(--chart-mute)" stroke-width="1.5" stroke-opacity=".38" stroke-linejoin="round"/>`).join('');
    const inEvidenza = serie.filter(s => s.evidenzia);
    const colore = s => (s.colore === 'b' ? 'var(--chart-b)' : 'var(--chart-accent)');
    const usate = [];
    const top = inEvidenza.map(s => {
      const ult = s.punti[s.punti.length - 1];
      let y = Y(ult.y) + 4;
      while (usate.some(v => Math.abs(v - y) < 11)) y += 11;   // etichette che non si accavallano
      usate.push(y);
      return `<path d="${path(s)}" fill="none" stroke="${colore(s)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
        s.punti.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.5" fill="${colore(s)}" stroke="var(--surface)" stroke-width="2"/>`).join('') +
        `<text class="lbl" x="${(X(ult.x) + 8).toFixed(1)}" y="${y.toFixed(1)}">${esc(bel(s.nome))}</text>`;
    }).join('');
    const legenda = inEvidenza.length > 1
      ? `<div class="legend">${inEvidenza.map(s => `<span class="${s.colore === 'b' ? 'b' : ''}"><i></i>${esc(bel(s.nome))}</span>`).join('')}</div>`
      : '';
    const dati = JSON.stringify(inEvidenza.map(s => ({ n: bel(s.nome), p: s.punti.map(p => [p.x, p.y]) })));
    return `${legenda}<div class="chart-wrap" data-tip="${esc(dati)}">
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.alt || 'Andamento')}">
        ${griglia.join('')}${assex.join('')}${sfondo}${top}
      </svg><div class="tip" hidden></div></div>`;
  }

  // ---------------------------------------------------------------- pezzi
  const tile = (v, et, cls) => `<div class="tile ${cls || ''}"><b>${esc(v)}</b><span>${esc(et)}</span></div>`;

  function rigaPartita(m, opts) {
    const casa = m.casa ? teamName(m.casa) : (m.pos_casa ? m.pos_casa + 'º in classifica' : '—');
    const fuori = m.fuori ? teamName(m.fuori) : (m.pos_fuori ? m.pos_fuori + 'º in classifica' : '—');
    const g = m.gol_casa != null;
    const cls = !g ? '' : m.gol_casa > m.gol_fuori ? 'win-h' : m.gol_casa < m.gol_fuori ? 'win-a' : '';
    const pts = g && m.totale_casa != null ? `<span class="pts">${n1(m.totale_casa)} · ${n1(m.totale_fuori)}</span>` : '';
    const punteggio = g ? `${m.gol_casa}<span aria-hidden="true">–</span>${m.gol_fuori}` : (opts && opts.ora ? '—' : 'da giocare');
    return `<button type="button" class="match ${cls}" ${g ? 'data-match="' + m.round + ':' + m.slot + '"' : 'disabled'}>
      <span class="t">${esc(casa)}</span>
      <span><span class="score">${punteggio}</span>${pts}</span>
      <span class="t a">${esc(fuori)}</span></button>`;
  }
